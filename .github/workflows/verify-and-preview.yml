name: Build and Deploy Learning Platform

# Pushes to main and Java-data publisher dispatches deploy production only
# after the complete artifact has passed verification. PRs never deploy.
# Manual runs can opt into Preview but never deploy production.
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [java-data-published]
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: 'Deploy an isolated Cloudflare Workers Preview (never production)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: learning-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and verify finished dist artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Test Java Data Consumer and URL mapping
        run: npm run test:data

      - name: Test public GitHub Release lookup and Worker fallback
        run: npm run test:local-run

      - name: Validate Cloudflare Worker, build coordinator and bindings
        run: |
          npm run test:worker
          npm run check:worker

      - name: Build frontend and consume verified Java Release
        env:
          # The producer dispatched the exact uploaded ZIP/manifest. A newer
          # rolling Release must not silently replace the expected version.
          JAVA_DATA_DISPATCH_REQUIRED: ${{ github.event_name == 'repository_dispatch' }}
          JAVA_DATA_EXPECTED_SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
          JAVA_DATA_EXPECTED_SHA256: ${{ github.event.client_payload.data_sha256 }}
        run: npm run build

      - name: Validate Wrangler bundle after building dist
        run: npm run check:wrangler

      - name: Verify complete deployable assets
        run: node scripts/verify-dist.mjs

      - name: Upload verified dist for review and optional preview
        uses: actions/upload-artifact@v6
        with:
          name: learning-platform-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  preview:
    name: Deploy isolated Cloudflare Preview and smoke-test
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_preview == true }}
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 30
    steps:
      - name: Checkout only the deploy configuration and checks
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download the already-verified dist artifact
        uses: actions/download-artifact@v7
        with:
          name: learning-platform-dist
          path: dist/

      - name: Require Cloudflare credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CF_API_TOKEN}" || -z "${CF_ACCOUNT_ID}" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets before opting into Preview."
            exit 1
          fi

      # Cloudflare Workers Previews are isolated from production deployments.
      # Do NOT change this command to "deploy" in this workflow.
      - name: Create Cloudflare Workers Preview only
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: preview --name step-3-3

      - name: Validate live preview endpoints
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: node scripts/check-preview.mjs "${PREVIEW_URL}"

      - name: Show the preview URL
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          echo "### Cloudflare Workers Preview (not production)" >> "$GITHUB_STEP_SUMMARY"
          echo "${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy production Worker and verify live Knowledge
    needs: build
    # Production is NEVER deployed from PRs or manual Preview runs. Both the
    # Java publisher and normal frontend main pushes use exactly this gate.
    if: ${{ github.repository == 'phuongnguyenit93/learning-platform' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'repository_dispatch') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout deployment configuration and verification scripts
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download exactly the verified build artifact
        uses: actions/download-artifact@v7
        with:
          name: learning-platform-dist
          path: dist/

      - name: Verify deployable artifact again
        run: node scripts/verify-dist.mjs

      - name: Require production Cloudflare credentials and expected Worker
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_API_TOKEN}" || -z "${CF_ACCOUNT_ID}" ]]; then
            echo "::error::Missing Cloudflare credentials. Production was NOT deployed."
            exit 1
          fi
          node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8")); if (config.name !== "learning-platform" || config.assets?.directory !== "./dist") process.exit(1)'

      - name: Deploy to existing Cloudflare Worker learning-platform
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: deploy

      - name: Verify deployed production content equals the built artifact
        run: |
          node scripts/check-production.mjs https://learning-platform.phuongnguyenit93.workers.dev
          node scripts/check-production.mjs https://nguyendodinhphuong.name.vn

      - name: Summarize production publication
        run: |
          echo "### Production deployment verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: learning-platform" >> "$GITHUB_STEP_SUMMARY"
          echo "Public site: https://nguyendodinhphuong.name.vn" >> "$GITHUB_STEP_SUMMARY"
          echo "Both Worker and custom domain serve the verified build's Java catalog and OOP Knowledge bytes." >> "$GITHUB_STEP_SUMMARY"
